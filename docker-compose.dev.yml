services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galerie}
      POSTGRES_USER: ${POSTGRES_USER:-galerie_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-local-only}
    ports:
      - "5432:5432"
    volumes:
      - galerie-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_app
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-local-only}
    volumes:
      - galerie-dev-keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=http://localhost:${KEYCLOAK_HTTP_PORT:-8082}
      - --hostname-strict=false
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8082}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dev-local-only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-dev-local-only}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./build/dev-keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-database:
        condition: service_healthy

  reconstruction-api:
    build:
      context: ./services/reconstruction-api
    restart: unless-stopped
    ports:
      - "${RECONSTRUCTION_HTTP_PORT:-8000}:8000"
    environment:
      RECONSTRUCTION_MODE: ${RECONSTRUCTION_MODE:-disabled}
      DATA_DIR: /app/data
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - galerie-dev-reconstruction-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  galerie-dev-postgres-data:
  galerie-dev-keycloak-postgres-data:
  galerie-dev-reconstruction-data:
