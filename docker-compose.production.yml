services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galerie}
      POSTGRES_USER: ${POSTGRES_USER:-galerie_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak_app
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build:
      context: ./keycloak
    restart: unless-stopped
    command:
      - start
      - --optimized
      - --http-enabled=true
      - --hostname=${PUBLIC_KEYCLOAK_URL:?Set PUBLIC_KEYCLOAK_URL}
      - --hostname-strict=false
      - --proxy-headers=xforwarded
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-database:5432/keycloak
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      keycloak-database:
        condition: service_healthy

  ollama:
    build:
      context: ./services/ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 45s

  java-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-galerie}
      DATABASE_USERNAME: ${POSTGRES_USER:-galerie_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FRONTEND_ORIGIN: ${PUBLIC_FRONTEND_ORIGIN:?Set PUBLIC_FRONTEND_ORIGIN}
      KEYCLOAK_ISSUER_URI: ${PUBLIC_KEYCLOAK_ISSUER_URI:?Set PUBLIC_KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-galerie}/protocol/openid-connect/certs
      PUBLIC_KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-movie_project_keycloak}
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?Set KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM_ADMIN_USERNAME: ${KEYCLOAK_REALM_ADMIN_USERNAME:?Set KEYCLOAK_REALM_ADMIN_USERNAME}
      KEYCLOAK_REALM_ADMIN_EMAIL: ${KEYCLOAK_REALM_ADMIN_EMAIL:-}
      KEYCLOAK_REALM_ADMIN_PASSWORD: ${KEYCLOAK_REALM_ADMIN_PASSWORD:?Set KEYCLOAK_REALM_ADMIN_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_started
      ollama:
        condition: service_healthy

  reconstruction-api:
    build:
      context: ./services/reconstruction-api
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:8000:8000"
    environment:
      RECONSTRUCTION_MODE: ${RECONSTRUCTION_MODE:-disabled}
      DATA_DIR: /app/data
      CORS_ORIGINS: ${PUBLIC_FRONTEND_ORIGIN:?Set PUBLIC_FRONTEND_ORIGIN}
    volumes:
      - reconstruction-data:/app/data

  frontend:
    build:
      context: ./galerie_de_ruiter_frontend_app
      args:
        VITE_JAVA_API_URL: ${VITE_JAVA_API_URL:?Set VITE_JAVA_API_URL}
        VITE_JAVA_BACKEND_URL: ${VITE_JAVA_BACKEND_URL:?Set VITE_JAVA_BACKEND_URL}
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?Set VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-movie_project_keycloak}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-movie_project_frontend_client}
        VITE_RECONSTRUCTION_API_URL: ${VITE_RECONSTRUCTION_API_URL:?Set VITE_RECONSTRUCTION_API_URL}
        VITE_PYTHON_API_URL: ${VITE_PYTHON_API_URL:?Set VITE_PYTHON_API_URL}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:3000:80"
    depends_on:
      - java-api
      - keycloak

volumes:
  postgres-data:
  keycloak-postgres-data:
  reconstruction-data:
  ollama-models:
