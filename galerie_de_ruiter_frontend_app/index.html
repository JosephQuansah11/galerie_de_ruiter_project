<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <!-- The gallery's own language is Belgian Dutch; LanguageContext swaps this to the
         visitor's choice once the bundle has run, so a crawler that does not run it still
         reads the right language. -->
    <meta
        name="description"
        content="Galerie de Ruiter toont antiek en kunst met een verleden. Bekijk de collectie en praat met de galerie."
    />
    <meta name="theme-color" content="#841a23" />

    <!-- How a shared link to the gallery looks. Pages replace the title and description at
         runtime; these are the site-wide defaults. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Galerie de Ruiter" />
    <meta property="og:title" content="Galerie de Ruiter — antiek en kunst" />
    <meta property="og:description" content="Galerie de Ruiter toont antiek en kunst met een verleden. Bekijk de collectie en praat met de galerie." />
    <meta property="og:url" content="<%= htmlWebpackPlugin.options.siteUrl %>/" />
    <meta property="og:image" content="<%= htmlWebpackPlugin.options.siteUrl %>/logo512.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- The gallery type comes from Google Fonts. The preconnects open the two connections
         while the parser is still reading this file, and the stylesheet is fetched with
         media="print" so it never holds up the first paint. The bundle flips it to media="all"
         as soon as it runs — an inline onload handler would need 'unsafe-inline' in the CSP. The
         noscript copy keeps the type for clients that do not run the app's JavaScript. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        id="gallery-fonts"
        rel="stylesheet"
        media="print"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"
    />
    <noscript>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap"
        />
    </noscript>

    <title>Galerie de Ruiter — antiek en kunst</title>
</head>

<body>
    <div id="root"></div>

    <!-- Every page is drawn by the bundle, so a client that does not run JavaScript - and the
         first pass of a crawler - would otherwise see an empty document. This is the gallery's
         own description of itself, not copy written for a search engine. -->
    <noscript>
        <div class="noscript-page">
            <h1>Galerie de Ruiter</h1>
            <p>
                Galerie de Ruiter toont antiek en kunst met een verleden. De collectie en de
                galeriechat worden door de applicatie getoond; zet JavaScript aan om ze te bekijken.
            </p>
            <p><a href="/login">Aanmelden</a> om de collectie te bekijken.</p>
        </div>
    </noscript>
</body>
</html>
