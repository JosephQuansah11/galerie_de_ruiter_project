server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GLB models are uploaded through the API; allow the same large bodies locally
    # that the API accepts in production.
    client_max_body_size 300M;

    # --- Security headers --------------------------------------------------------------------
    # They live in security-headers.conf, which the image copies to /etc/nginx/, because two
    # responses need them: every response, and the sign-out response below, whose own add_header
    # would otherwise drop the inherited ones. That file explains each header; the Render blueprint
    # sends the same set for the static deployment and src/securityHeaders.test.ts fails when the
    # two drift apart.
    include /etc/nginx/security-headers.conf;

    # Cloudflare's JavaScript Detections injects an inline <script> with a per-request token into
    # HTML responses; no CSP hash can allow it. `no-transform` is Cloudflare's documented opt-out
    # and keeps script-src free of 'unsafe-inline'. The directive changes no cache lifetime.
    add_header Cache-Control "no-transform" always;

    # The first paint waits on the stylesheet bundle and the entry scripts, so they travel
    # compressed: nginx only compresses text/html out of the box. Models and images are
    # already compressed formats and are left alone.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # The gallery type keeps its name and is never edited in place, so the browser may keep it:
    # without this every visit revalidates both preloaded faces. expires sets the cache header
    # without the add_header inheritance rules that would drop the security headers above.
    location ~* ^/fonts/ {
        expires max;
    }

    # The files agents and registries look for by convention (see public/.well-known/). They exist
    # to be read from somewhere else, so this is the one location that grants that - the same
    # exception the Render blueprint makes - and the security headers are included again because a
    # location-level add_header would otherwise drop them.
    location ^~ /.well-known/ {
        include /etc/nginx/security-headers.conf;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Signing out ends the Keycloak session, and Keycloak then returns the browser here (see the
    # redirectUri in AuthContext.logout). This is the one response that tells the browser to drop
    # what it holds for the gallery's origin: the cookies, the storage - the chosen language, the
    # remembered city, the cached responses and the chat session - and the HTTP cache. The app
    # clears what it owns in memory; this clears what it cannot reach.
    location = /logout {
        try_files /index.html =200;
        include /etc/nginx/security-headers.conf;
        add_header Clear-Site-Data '"cache", "cookies", "storage"' always;
        # The location's own add_header drops the inherited ones, including the no-transform above.
        add_header Cache-Control "no-transform" always;
    }

    # The addresses that are not pages. `/home` is what the landing page was called before it moved
    # to the root, and `/dashboard` and `/dashboard/chat` are older still: all three are known to
    # search engines, and a permanent redirect is what tells them which URL is canonical instead of
    # leaving two addresses for one page. Exact matches, so they are answered before the routes
    # below are considered.
    location = /home { return 301 /; }
    location = /dashboard { return 301 /; }
    location = /dashboard/chat { return 301 /chat; }

    # The paths the application draws, in one regular expression: the bundle renders all of them
    # from the shell. The list mirrors the router (src/AppContent.tsx, src/ProtectedRoutes.tsx), and
    # src/spaRoutes.test.ts fails when the two drift apart.
    location ~ ^/(home|chat|about|map|login|register|profile|preferences|wishlist|cart|antiques|admin|dashboard)(/.*)?$ {
        try_files $uri /index.html;
    }

    # Everything else is a file that exists, or a path the gallery does not have. Answering every
    # typo with the shell and HTTP 200 is what an audit reported: a search engine then indexes the
    # landing page under addresses that do not exist. The 404 below tells it the truth, and
    # `public/404.html` is the page a visitor gets.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
