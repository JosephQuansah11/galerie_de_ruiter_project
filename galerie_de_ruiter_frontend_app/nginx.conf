server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GLB models are uploaded through the API; allow the same large bodies locally
    # that the API accepts in production.
    client_max_body_size 300M;

    # --- Security headers --------------------------------------------------------------------
    # The site is a single HTML page that renders itself from the bundle it ships, so the origins
    # it needs are its own, the gallery type, the map frame and the API. `script-src 'self'`
    # without 'unsafe-inline' or 'unsafe-eval' is what makes the policy worth having against XSS:
    # the app has no inline script and no eval. The API and Keycloak origins arrive as
    # environment variables (see the Dockerfile) so the policy matches the build.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: ${CSP_API_ORIGIN}; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_KEYCLOAK_ORIGIN} https://nominatim.openstreetmap.org; frame-src https://www.openstreetmap.org ${CSP_KEYCLOAK_ORIGIN}; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Trusted Types is staged in report-only mode. Loading the built site with the enforced policy
    # above reports exactly one violation: webpack's own chunk loader setting `script.src` for a
    # lazily loaded route, which every navigation needs. Give webpack a policy with
    # `output.trustedTypes` and then move these two directives into the policy above — see
    # "Security headers" in the README.
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default" always;

    # HSTS. Roll it out in stages if you are not certain every subdomain can serve HTTPS: start
    # with a low max-age (for example 300) and raise it once that is certain.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Nothing may embed the gallery, and the page keeps no handle on the windows it opens. The
    # WhatsApp and map links are ordinary new tabs, so nothing here needs window.opener.
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The first paint waits on the stylesheet bundle and the entry scripts, so they travel
    # compressed: nginx only compresses text/html out of the box. Models and images are
    # already compressed formats and are left alone.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
