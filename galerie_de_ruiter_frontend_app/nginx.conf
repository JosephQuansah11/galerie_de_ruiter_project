server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GLB models are uploaded through the API; allow the same large bodies locally
    # that the API accepts in production.
    client_max_body_size 300M;

    # --- Security headers --------------------------------------------------------------------
    # They live in security-headers.conf, which the image copies to /etc/nginx/, because two
    # responses need them: every response, and the sign-out response below, whose own add_header
    # would otherwise drop the inherited ones. That file explains each header; the Render blueprint
    # sends the same set for the static deployment and src/securityHeaders.test.ts fails when the
    # two drift apart.
    include /etc/nginx/security-headers.conf;

    # The first paint waits on the stylesheet bundle and the entry scripts, so they travel
    # compressed: nginx only compresses text/html out of the box. Models and images are
    # already compressed formats and are left alone.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # The gallery type keeps its name and is never edited in place, so the browser may keep it:
    # without this every visit revalidates both preloaded faces. expires sets the cache header
    # without the add_header inheritance rules that would drop the security headers above.
    location ~* ^/fonts/ {
        expires max;
    }

    # Signing out ends the Keycloak session, and Keycloak then returns the browser here (see the
    # redirectUri in AuthContext.logout). This is the one response that tells the browser to drop
    # what it holds for the gallery's origin: the cookies, the storage - the chosen language, the
    # remembered city, the cached responses and the chat session - and the HTTP cache. The app
    # clears what it owns in memory; this clears what it cannot reach.
    location = /logout {
        try_files /index.html =200;
        include /etc/nginx/security-headers.conf;
        add_header Clear-Site-Data '"cache", "cookies", "storage"' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
