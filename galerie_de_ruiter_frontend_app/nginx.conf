server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # GLB models are uploaded through the API; allow the same large bodies locally
    # that the API accepts in production.
    client_max_body_size 300M;

    # --- Security headers --------------------------------------------------------------------
    # The site is a single HTML page that renders itself from the bundle it ships, so the origins
    # it needs are its own, the map frame and the API: the gallery type is served from this origin
    # (public/fonts, see the Speed section of the README). `script-src 'self'` without
    # 'unsafe-inline' or 'unsafe-eval' is what makes the policy worth having against XSS: the app
    # has no inline script and no eval. `frame-src` lists 'self' for the hidden iframe
    # keycloak-js uses for the silent sign-in check (public/silent-check-sso.html). The API and
    # Keycloak origins arrive as environment variables (see the Dockerfile) so the policy matches
    # the build.
    #
    # `style-src-attr 'unsafe-inline'` is not decoration: the charts size their bars, the theme
    # picker draws its swatches and the photo carousel positions its slides with style attributes,
    # which `style-src 'self'` alone would block. The same policy is written out in `render.yaml`
    # for the static deployment, where these variables do not exist, and
    # `src/securityHeaders.test.ts` fails when the two drift apart.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: ${CSP_API_ORIGIN}; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_KEYCLOAK_ORIGIN} https://nominatim.openstreetmap.org; frame-src 'self' https://www.openstreetmap.org ${CSP_KEYCLOAK_ORIGIN}; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Trusted Types is staged in report-only mode. Loading the built site with the enforced policy
    # above reports exactly one violation: webpack's own chunk loader setting `script.src` for a
    # lazily loaded route, which every navigation needs. Give webpack a policy with
    # `output.trustedTypes` and then move these two directives into the policy above — see
    # "Security headers" in the README.
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default" always;

    # HSTS. Roll it out in stages if you are not certain every subdomain can serve HTTPS: start
    # with a low max-age (for example 300) and raise it once that is certain.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Nothing may embed the gallery, and the page keeps no handle on the windows it opens. The
    # WhatsApp and map links are ordinary new tabs, so nothing here needs window.opener.
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The gallery's own resources are for the gallery's own pages. Cross-Origin-Embedder-Policy is
    # deliberately not sent: requiring it would block the map and sign-in frames, which grant
    # nothing in return.
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # The gallery asks for none of these, and naming them keeps a future dependency from quietly
    # starting to.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # Flash and PDF cross-domain policy files: none may be loaded. The XSS filter is sent as "0"
    # because it is gone from current browsers and the policy above is the real defence; DNS
    # prefetching is off because nothing here benefits from it; the agent cluster is requested
    # origin-keyed so the gallery is not grouped into one process with another origin.
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header X-DNS-Prefetch-Control "off" always;
    add_header Origin-Agent-Cluster "?1" always;

    # The first paint waits on the stylesheet bundle and the entry scripts, so they travel
    # compressed: nginx only compresses text/html out of the box. Models and images are
    # already compressed formats and are left alone.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
