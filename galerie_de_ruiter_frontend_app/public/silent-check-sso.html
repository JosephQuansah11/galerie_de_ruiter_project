<!DOCTYPE html>
<html lang="nl-BE">
<head>
    <meta charset="UTF-8" />
    <title>Galerie de Ruiter</title>
</head>
<body>
    <!--
        keycloak-js loads this page in a hidden iframe for the silent sign-in check and reads the
        answer out of its fragment, which keeps the check inside the page. Without it keycloak-js
        navigates the top-level document to the identity provider and back, so the visitor waits
        for the whole page to load twice before anything is painted.

        The helper is a separate file rather than an inline script, because the gallery's
        Content-Security-Policy is `script-src 'self'` with no 'unsafe-inline': the policy stays
        as strict as it was. The policy does have to allow the frame itself, so `frame-src` in
        nginx.conf lists 'self' alongside the map and Keycloak.
    -->
    <script src="/silent-check-sso.js"></script>
</body>
</html>
