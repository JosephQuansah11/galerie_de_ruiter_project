# The gallery's security headers, in one place because two responses need them: every response, and
# the sign-out response, whose own `add_header` would otherwise drop the inherited ones (nginx
# inherits `add_header` only when the level defines none of its own).
#
# `nginx.conf` includes this file at server level and again in its `/logout` location, and
# `src/securityHeaders.test.ts` compares it with the headers the Render blueprint sends for the
# static deployment, so the two cannot drift apart.

# The site is a single HTML page that renders itself from the bundle it ships, so the origins it
# needs are its own, the gallery type (public/fonts), the Google Maps frame and geocoder, and the
# API. `script-src 'self'` without 'unsafe-inline' or 'unsafe-eval' is what makes the policy worth
# having against XSS: the app has no inline script and no eval. `frame-src` lists 'self' for the
# hidden iframe keycloak-js uses for the silent sign-in check (public/silent-check-sso.html). The
# API and Keycloak origins arrive as environment variables (see the Dockerfile) so the policy
# matches the build.
#
# `style-src-attr 'unsafe-inline'` is not decoration: the charts size their bars, the theme picker
# draws its swatches and the photo carousel positions its slides with style attributes, which
# `style-src 'self'` alone would block.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: ${CSP_API_ORIGIN}; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_KEYCLOAK_ORIGIN} https://maps.googleapis.com; frame-src 'self' https://www.google.com ${CSP_KEYCLOAK_ORIGIN}; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# Trusted Types is staged in report-only mode. Loading the built site with the enforced policy above
# reports exactly one violation: webpack's own chunk loader setting `script.src` for a lazily loaded
# route, which every navigation needs. Give webpack a policy with `output.trustedTypes` and then
# move these two directives into the policy above — see "Security headers" in the README.
add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default" always;

# HSTS. Roll it out in stages if you are not certain every subdomain can serve HTTPS: start with a
# low max-age (for example 300) and raise it once that is certain.
add_header Strict-Transport-Security "max-age=31536000" always;

# Nothing outside the gallery may embed it — a foreign page framing the site is the clickjacking
# risk this defends against — but the gallery does embed one of its own pages: the hidden iframe
# keycloak-js uses for the silent sign-in check. `'self'` and SAMEORIGIN allow exactly that and
# nothing more; `'none'` and DENY blocked the check itself.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# `credentialless` is the value for a page that embeds third-party content, which this one does: the
# Google Maps frame. `require-corp` would refuse to load any cross-origin resource that does not
# grant permission through Cross-Origin-Resource-Policy, and neither Google's map frame nor
# Keycloak's silent sign-in page sends that header — it would break both. `credentialless` instead
# sends the cross-origin no-cors requests without credentials, which is what a page like this one
# wants: the gallery's own images from the API are public reads that need no cookie, and the frames
# keep their own browsing context, cookies included.
add_header Cross-Origin-Embedder-Policy "credentialless" always;

# The gallery's own resources are for the gallery's own pages: a foreign site may not load them.
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The gallery asks for none of these, and naming them keeps a future dependency from quietly
# starting to.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Flash and PDF cross-domain policy files: none may be loaded. The XSS filter is sent as "0" because
# it is gone from current browsers and the policy above is the real defence; DNS prefetching is off
# because nothing here benefits from it; the agent cluster is requested origin-keyed so the gallery
# is not grouped into one process with another origin.
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-XSS-Protection "0" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header Origin-Agent-Cluster "?1" always;
