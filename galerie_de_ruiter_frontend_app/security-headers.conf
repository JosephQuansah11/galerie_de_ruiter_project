# The gallery's security headers, in one place because two responses need them: every response, and
# the sign-out response, whose own `add_header` would otherwise drop the inherited ones (nginx
# inherits `add_header` only when the level defines none of its own).
#
# `nginx.conf` includes this file at server level and again in its `/logout` location, and
# `src/securityHeaders.test.ts` compares it with the headers the Render blueprint sends for the
# static deployment, so the two cannot drift apart.

# The site is a single HTML page that renders itself from the bundle it ships, so the origins it
# needs are its own, the gallery type (public/fonts), the Google Maps frame and geocoder, and the
# API. `script-src 'self'` without 'unsafe-inline' or 'unsafe-eval' is what makes the policy worth
# having against XSS: the app has no inline script and no eval. `frame-src` lists 'self' beside the
# map and Keycloak: the gallery frames nothing of its own today, but a same-origin frame is the one
# thing that value cannot break, and Keycloak is named because keycloak-js is free to frame it. The
# API and Keycloak origins arrive as environment variables (see the Dockerfile) so the policy
# matches the build.
#
# `style-src-attr 'unsafe-inline'` is not decoration: the charts size their bars, the theme picker
# draws its swatches and the photo carousel positions its slides with style attributes, which
# `style-src 'self'` alone would block.
#
# `blob:` is in `connect-src` because the gallery's own 3D models travel as blob URLs: the admin's
# model picker previews a file that has not been uploaded yet, and three.js reads that URL with
# `fetch`, which `connect-src` governs. A blob URL belongs to this origin by construction, so this
# adds no origin to the allowlist - it is the same exception `img-src` and `worker-src` already make.
# Three origins belong to Microsoft Clarity, which the gallery loads only after the visitor allows
# analytics (see src/services/clarity.ts). It is named in script-src because the vendor tag is an
# external script, in connect-src because it sends what it records, and in img-src for its pixel.
# `https://*.clarity.ms` covers www and the a-z load balancers; `https://c.bing.com` is the other
# endpoint Microsoft's CSP guidance names. `script-src` still has no 'unsafe-inline' or
# 'unsafe-eval': the loader is part of the bundle, not a snippet pasted into the document.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clarity.ms https://c.bing.com; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: ${CSP_API_ORIGIN} https://*.clarity.ms https://c.bing.com; connect-src 'self' https://bgmxpublcoldebamstbj.supabase.co ${CSP_API_ORIGIN} ${CSP_KEYCLOAK_ORIGIN} https://maps.googleapis.com https://*.clarity.ms https://c.bing.com blob:; frame-src 'self' https://www.google.com ${CSP_KEYCLOAK_ORIGIN}; worker-src 'self' blob: https://*.clarity.ms; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

# Trusted Types is staged in report-only mode. Two pieces of code set a script `src`: webpack's
# chunk loader for a lazily loaded route, and the Clarity loader in src/services/clarity.ts. Each
# goes through a named policy - webpack's `default`, Clarity's `clarity` - so the directive below
# names both. What is left of the rollout is the last step: move these directives into the policy
# above; see "Security headers" in the README.
add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types default clarity" always;

# HSTS. Roll it out in stages if you are not certain every subdomain can serve HTTPS: start with a
# low max-age (for example 300) and raise it once that is certain. `includeSubDomains` costs nothing
# here - the gallery's host is galeriederuiter.cloud-ip.cc, so it covers subdomains of a name the
# gallery would create itself, and there are none - and it is what a hardened deployment sends.
# `preload` is deliberately absent: preloading means submitting the domain to the browsers' list,
# which can only be done for a registrable domain the publisher owns, and this host is a subdomain
# of cloud-ip.cc. A `preload` token on a host that cannot be submitted claims a commitment nobody
# can honour; the year-long max-age is the part that actually protects a visitor.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Nothing outside the gallery may embed it: a foreign page framing the site is the clickjacking risk
# this defends against. `'self'` rather than `'none'` is deliberate - the gallery framed one of its
# own pages for the silent sign-in check until that check was dropped (see "Sign in" in the frontend
# README), and `'self'` is the tightest value that cannot break a same-origin frame if one comes
# back. Tightening this pair to `'none'` and DENY is safe today.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# No Cross-Origin-Embedder-Policy. COEP makes every cross-origin resource on the page - every frame,
# image and script - declare a Cross-Origin-Resource-Policy it may not have, and the resources this
# page loads are mostly other people's: the Google Maps frame and Keycloak's own pages, neither of
# which sends that header and neither of which this site can add it to. That is exactly what broke
# sign-in: keycloak-js loads Keycloak's third-party-cookie probe in a hidden iframe, the browser
# refused it under COEP, the adapter's promise rejected on its ten-second timeout, and the sign-in
# button did nothing. `credentialless` - the alternative the guidance offers - does not help, because
# that frame is still refused. Nothing here needs `crossOriginIsolated`, which is the only thing COEP
# buys, so the site sends none and relies on the resource policy below, which is about the gallery's
# own responses.

# The gallery's own resources are for the gallery's own pages: a foreign site may not load them.
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The gallery asks for none of these, and naming them keeps a future dependency from quietly
# starting to.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

# Flash and PDF cross-domain policy files: none may be loaded. The XSS filter is sent as "0" because
# it is gone from current browsers and the policy above is the real defence; DNS prefetching is off
# because nothing here benefits from it; the agent cluster is requested origin-keyed so the gallery
# is not grouped into one process with another origin.
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header X-XSS-Protection "0" always;
add_header X-DNS-Prefetch-Control "off" always;
add_header Origin-Agent-Cluster "?1" always;
