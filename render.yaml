databases:
  - name: galerie-app-db
    databaseName: galerie
    user: galerie_app
    plan: basic-256mb

services:
  # galerie-reconstruction-api (services/reconstruction-api) used to run here: a Python service that
  # turned six photographs into a 3D model. The frontend half of it was removed before the gallery
  # ever used it, so nothing called the service and it ran with RECONSTRUCTION_MODE=disabled. The
  # service, its 1 GB data disk, the endpoints it fed and the copy that named it are gone with it -
  # and a blueprint sync deletes the Render service itself.
  # galerie-keycloak and galerie-keycloak-db used to run here. Production signs in with Supabase
  # (the API runs prod,supabase), so the service and its separate database are no longer needed.
  # A Blueprint sync deletes both from Render; the local Keycloak files remain for development.

  # galerie-ollama (services/ollama) used to run here: a private Ollama service with a 5 GB model
  # disk, holding the language model the chat answered from. The chat now answers from the gallery's
  # own records (see GalleryChatService), so the service, its disk and the model download are gone -
  # a private service on a `pro` plan plus 5 GB of disk, for a model nothing calls. A blueprint sync
  # deletes both.
  - type: web
    name: galerie-java-api
    # The API has to build the branch the code is on. Without this line the service follows the
    # repository's default branch, which does not carry the API's commits - so auto-deploy watches a
    # branch that never changes and the service keeps serving the build it was created with, however
    # many times the API's code is pushed.
    branch: frontend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    # 3D models are written to a persistent disk instead of a database column: a .glb is far
    # larger than the rest of the catalogue, and PostgreSQL on a small plan could not take it.
    # A disk pins the service to a single instance. Size it for the models you keep.
    disk:
      name: galerie-models
      mountPath: /app/data/models
      sizeGB: 5
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,supabase
      # Supabase signs with ES256 and publishes its keys at a path issuer discovery does not use,
      # so the resource server is given the issuer and key set directly. See
      # application-supabase.yml.
      - key: SUPABASE_ISSUER_URI
        value: https://bgmxpublcoldebamstbj.supabase.co/auth/v1
      - key: SUPABASE_JWK_SET_URI
        value: https://bgmxpublcoldebamstbj.supabase.co/auth/v1/.well-known/jwks.json
      - key: JPA_DDL_AUTO
        value: update
      - key: PORT
        value: "8080"
      - key: MODELS_STORAGE_DIR
        value: /app/data/models
      - key: DATABASE_HOST
        fromDatabase:
          name: galerie-app-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: galerie-app-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: galerie-app-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: galerie-app-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: galerie-app-db
          property: password
      # The browser origin allowed to call the API: the gallery's own domain. The parser still
      # accepts a comma-separated list, so a staging origin can be added without changing code, but
      # production serves one canonical host.
      - key: FRONTEND_ORIGIN
        value: https://galeriederuiterantieks.gripe
  - type: web
    name: galerie-frontend
    runtime: static
    rootDir: galerie_de_ruiter_frontend_app
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: SITE_URL
        value: https://galeriederuiterantieks.gripe
      - key: VITE_JAVA_API_URL
        value: https://galerie-java-api.onrender.com
      # The sitemap script reads the piece list from the API at build time, so a piece's own page
      # is discoverable even before a crawler follows a card's link.
      - key: SITEMAP_API_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_JAVA_BACKEND_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_API_URL
        value: https://galerie-java-api.onrender.com
      # Supabase Auth is the production identity provider. The project URL is public; the anon key
      # is set in the Render dashboard with `sync: false`.
      - key: VITE_SUPABASE_URL
        value: https://bgmxpublcoldebamstbj.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # The Google Maps browser key: the location page's Embed API frame and the admin's address
      # lookup (see "Google Maps" in the frontend README). Restricted by HTTP referrer to the
      # gallery's origins; without it the location page shows the address and a Maps link instead.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      # The addresses that are not pages. `/home` is what the landing page was called before it
      # moved to the root, and `/dashboard` and `/dashboard/chat` are older still: all three are
      # known to search engines, and a redirect is what tells them which URL is canonical instead
      # of leaving two addresses for one page. A redirect rule is applied before a rewrite and only
      # where no file exists, and Render applies no rule to a domain root - which is why the root
      # is the canonical address and these are the ones that redirect.
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /dashboard
        destination: /
      - type: redirect
        source: /dashboard/chat
        destination: /chat
      # The paths the application draws, one rewrite each: the bundle renders all of them from the
      # shell, and Render serves a file that exists before it applies a rule, so a real file at one
      # of these paths still wins. Everything else is a path the gallery does not have, and Render
      # answers that with 404 Not Found - which is what a search engine needs to hear. The catch-all
      # `/*` -> `/index.html` that used to be here answered every typo with the landing page and
      # HTTP 200, which is how a site ends up with hundreds of indexed error pages. The list mirrors
      # the router (src/AppContent.tsx, src/ProtectedRoutes.tsx); src/spaRoutes.test.ts fails when
      # the two drift apart. `/` is not here because a rewrite cannot name the domain root - Render
      # serves `index.html` for it already.
      - type: rewrite
        source: /chat
        destination: /index.html
      - type: rewrite
        source: /about
        destination: /index.html
      - type: rewrite
        source: /map
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /register
        destination: /index.html
      - type: rewrite
        source: /logout
        destination: /index.html
      - type: rewrite
        source: /profile
        destination: /index.html
      - type: rewrite
        source: /preferences
        destination: /index.html
      - type: rewrite
        source: /wishlist
        destination: /index.html
      - type: rewrite
        source: /cart
        destination: /index.html
      - type: rewrite
        source: /antiques
        destination: /index.html
      - type: rewrite
        source: /antiques/*
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html
    # The security headers a static site cannot get from a server: there is nothing at the origin to
    # inject them, so Render sends these from the edge. Values are sent as written - there is no
    # environment substitution - so the API and Keycloak origins are spelled out; they are the same
    # ones the build above uses. `nginx.conf` sends the same policy for the container deployment,
    # and `src/securityHeaders.test.ts` fails when the two drift apart.
    #
    # Editing this file only reaches the site when the Blueprint is synced in the Render dashboard:
    # `autoDeploy` deploys code, not Blueprint changes.
    #
    # `style-src-attr 'unsafe-inline'` is not decoration: the charts size their bars, the theme
    # picker draws its swatches and the photo carousel positions its slides with style attributes,
    # which `style-src 'self'` alone would block. There is deliberately no Cross-Origin-Embedder-
    # Policy: COEP makes every cross-origin frame, image and script on the page declare a
    # Cross-Origin-Resource-Policy, and the ones this page loads are other people's - the Google map
    # and Keycloak's own pages - which send none and cannot be given one. Keycloak's third-party-
    # cookie probe is what that broke: keycloak-js loads it in a hidden iframe, COEP refused it, and
    # the sign-in button stopped working. `credentialless` does not help; that frame is still
    # refused. Nothing here needs crossOriginIsolated, which is all COEP buys.
    headers:
      # `blob:` is in connect-src because the gallery's own 3D models travel as blob URLs: the
      # admin's model picker previews a file that has not been uploaded yet, and three.js reads that
      # URL with fetch, which connect-src governs. A blob URL belongs to this origin by
      # construction, so it adds no origin to the allowlist.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://*.clarity.ms https://c.bing.com; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://galerie-java-api.onrender.com https://*.clarity.ms https://c.bing.com; connect-src 'self' https://bgmxpublcoldebamstbj.supabase.co https://galerie-java-api.onrender.com https://maps.googleapis.com https://*.clarity.ms https://c.bing.com blob:; frame-src 'self' https://www.google.com; worker-src 'self' blob: https://*.clarity.ms; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Trusted Types is staged in report-only mode, exactly as the container deployment sends it
      # (see security-headers.conf). Two pieces of code set a script `src`: webpack's chunk loader
      # and the Clarity loader, each through its own named policy (`default`, `clarity`). Move the
      # directives into the enforced policy above once the report is clean.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "require-trusted-types-for 'script'; trusted-types default clarity"
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Origin-Agent-Cluster
        value: "?1"
      - path: /*
        name: X-DNS-Prefetch-Control
        value: "off"
      - path: /*
        name: X-XSS-Protection
        value: "0"
      # The gallery type keeps its name and is never edited in place, and Render's default for a file
      # it does not fingerprint is max-age=0: without this every visit revalidates both preloaded
      # faces, which is two round trips before the text can settle.
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Cloudflare's JavaScript Detections injects an inline <script> into HTML responses. Its token
      # changes on every request, so `script-src` cannot allow it with a hash - and 'unsafe-inline'
      # would undo the policy. Cloudflare's documented opt-out is a `no-transform` cache directive on
      # the HTML response, which is why every HTML entry point carries it below. Render matches a
      # header path against the request path, so each route in the `routes` block needs its own
      # entry; hashed assets keep their longer cache lifetime. Changing this block takes a Blueprint
      # sync, and Cloudflare may serve an older cached HTML response until it expires or is purged.
      - path: /
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /404.html
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /chat
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /about
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /map
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /login
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /register
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /logout
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /profile
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /preferences
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /wishlist
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /cart
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /antiques
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /antiques/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      - path: /admin/*
        name: Cache-Control
        value: public, max-age=0, s-maxage=300, no-transform
      # The manifest agents and registries look for by convention (public/.well-known/ai-catalog.json,
      # served at /ard.json's path too). The publishing guide asks for
      # `Access-Control-Allow-Origin: *`, because a crawler reading it from a page of its own makes a
      # cross-origin request; `same-origin` is what every other response keeps, so the exception is
      # scoped to the one directory that exists to be read from elsewhere.
      - path: /.well-known/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /.well-known/*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      # Signing out ends the Keycloak session, and Keycloak then returns the browser to /logout (see
      # the redirectUri in AuthContext.logout). That one response tells the browser to drop what it
      # holds for the gallery's origin - cookies, storage (the chosen language, the remembered city,
      # the cached responses, the chat session) and the HTTP cache - which is the part the app
      # cannot clear itself. This is why the header is on a path rather than on the whole site.
      - path: /logout
        name: Clear-Site-Data
        value: '"cache", "cookies", "storage"'
