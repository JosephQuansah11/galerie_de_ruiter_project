databases:
  - name: galerie-app-db
    databaseName: galerie
    user: galerie_app
    plan: basic-256mb
  - name: galerie-keycloak-db
    databaseName: keycloak
    user: keycloak_app
    plan: basic-256mb

services:
  - type: web
    name: galerie-reconstruction-api
    runtime: docker
    dockerfilePath: ./services/reconstruction-api/Dockerfile
    dockerContext: ./services/reconstruction-api
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: reconstruction-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: RECONSTRUCTION_MODE
        value: local
      - key: CORS_ORIGINS
        value: https://galerie-frontend.onrender.com
      - key: DATA_DIR
        value: /app/data

  - type: web
    name: galerie-keycloak
    runtime: docker
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: ./keycloak
    plan: standard
    healthCheckPath: /realms/movie_project_keycloak/.well-known/openid-configuration
    autoDeploy: true
    envVars:
      - key: KC_HOSTNAME
        value: https://galerie-keycloak.onrender.com
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: galerie-keycloak-db
          property: host
      - key: KC_DB_URL_PORT
        fromDatabase:
          name: galerie-keycloak-db
          property: port
      - key: KC_DB_URL_DATABASE
        fromDatabase:
          name: galerie-keycloak-db
          property: database
      - key: KC_DB_USERNAME
        fromDatabase:
          name: galerie-keycloak-db
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: galerie-keycloak-db
          property: password
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: galerie-java-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JPA_DDL_AUTO
        value: update
      - key: PORT
        value: "8080"
      - key: DATABASE_HOST
        fromDatabase:
          name: galerie-app-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: galerie-app-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: galerie-app-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: galerie-app-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: galerie-app-db
          property: password
      - key: FRONTEND_ORIGIN
        value: https://galerie-frontend.onrender.com
      - key: KEYCLOAK_ISSUER_URI
        value: https://galerie-keycloak.onrender.com/realms/movie_project_keycloak
      - key: PUBLIC_KEYCLOAK_URL
        value: https://galerie-keycloak.onrender.com
      - key: KEYCLOAK_REALM
        value: movie_project_keycloak
      - key: KEYCLOAK_ADMIN_REALM
        value: master
      - key: KEYCLOAK_ADMIN_CLIENT_ID
        value: admin-cli
      - key: KEYCLOAK_ADMIN_USERNAME
        sync: false
      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: KEYCLOAK_REALM_ADMIN_USERNAME
        value: de-ruiter
      - key: KEYCLOAK_REALM_ADMIN_FIRST_NAME
        value: De
      - key: KEYCLOAK_REALM_ADMIN_LAST_NAME
        value: Ruiter
      - key: KEYCLOAK_REALM_ADMIN_EMAIL
        value: ""
      - key: KEYCLOAK_REALM_ADMIN_PASSWORD
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2:3b

  - type: web
    name: galerie-frontend
    runtime: static
    rootDir: galerie_de_ruiter_frontend_app
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_JAVA_API_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_JAVA_BACKEND_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_API_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_RECONSTRUCTION_API_URL
        value: https://galerie-reconstruction-api.onrender.com
      - key: VITE_PYTHON_API_URL
        value: https://galerie-reconstruction-api.onrender.com
      - key: VITE_KEYCLOAK_URL
        value: https://galerie-keycloak.onrender.com
      - key: VITE_KEYCLOAK_REALM
        value: movie_project_keycloak
      - key: VITE_KEYCLOAK_CLIENT_ID
        value: movie_project_frontend_client
    routes:
      - type: rewrite
        source: /*
        destination: /index.html