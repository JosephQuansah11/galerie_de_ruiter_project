databases:
  - name: galerie-app-db
    databaseName: galerie
    user: galerie_app
    plan: basic-256mb
  - name: galerie-keycloak-db
    databaseName: keycloak
    user: keycloak_app
    plan: basic-256mb

services:
  - type: web
    name: galerie-reconstruction-api
    runtime: docker
    dockerfilePath: ./services/reconstruction-api/Dockerfile
    dockerContext: ./services/reconstruction-api
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: reconstruction-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: RECONSTRUCTION_MODE
        value: disabled
      - key: CORS_ORIGINS
        value: https://galeriederuiter.cloud-ip.cc
      - key: DATA_DIR
        value: /app/data

  - type: web
    name: galerie-keycloak
    runtime: docker
    dockerfilePath: ./keycloak/Dockerfile
    dockerContext: ./keycloak
    plan: standard
    healthCheckPath: /realms/movie_project_keycloak/.well-known/openid-configuration
    autoDeploy: true
    envVars:
      - key: KC_HOSTNAME
        value: https://galerie-keycloak.onrender.com
      - key: KC_PROXY_HEADERS
        value: xforwarded
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL_HOST
        fromDatabase:
          name: galerie-keycloak-db
          property: host
      - key: KC_DB_URL_PORT
        fromDatabase:
          name: galerie-keycloak-db
          property: port
      - key: KC_DB_URL_DATABASE
        fromDatabase:
          name: galerie-keycloak-db
          property: database
      - key: KC_DB_USERNAME
        fromDatabase:
          name: galerie-keycloak-db
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: galerie-keycloak-db
          property: password
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: pserv
    name: galerie-ollama
    runtime: docker
    dockerfilePath: ./services/ollama/Dockerfile
    dockerContext: ./services/ollama
    plan: pro
    autoDeploy: true
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 5
    envVars:
      - key: OLLAMA_HOST
        value: 0.0.0.0:11434
      - key: OLLAMA_MODEL
        value: llama3.2:3b

  - type: web
    name: galerie-java-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    # 3D models are written to a persistent disk instead of a database column: a .glb is far
    # larger than the rest of the catalogue, and PostgreSQL on a small plan could not take it.
    # A disk pins the service to a single instance. Size it for the models you keep.
    disk:
      name: galerie-models
      mountPath: /app/data/models
      sizeGB: 5
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JPA_DDL_AUTO
        value: update
      - key: PORT
        value: "8080"
      - key: MODELS_STORAGE_DIR
        value: /app/data/models
      - key: DATABASE_HOST
        fromDatabase:
          name: galerie-app-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: galerie-app-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: galerie-app-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: galerie-app-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: galerie-app-db
          property: password
      - key: FRONTEND_ORIGIN
        value: https://galeriederuiter.cloud-ip.cc
      - key: KEYCLOAK_ISSUER_URI
        value: https://galerie-keycloak.onrender.com/realms/movie_project_keycloak
      - key: PUBLIC_KEYCLOAK_URL
        value: https://galerie-keycloak.onrender.com
      - key: KEYCLOAK_REALM
        value: movie_project_keycloak
      - key: KEYCLOAK_ADMIN_REALM
        value: master
      - key: KEYCLOAK_ADMIN_CLIENT_ID
        value: admin-cli
      - key: KEYCLOAK_ADMIN_USERNAME
        sync: false
      - key: KEYCLOAK_ADMIN_PASSWORD
        sync: false
      - key: KEYCLOAK_REALM_ADMIN_USERNAME
        value: de-ruiter
      - key: KEYCLOAK_REALM_ADMIN_FIRST_NAME
        value: De
      - key: KEYCLOAK_REALM_ADMIN_LAST_NAME
        value: Ruiter
      - key: KEYCLOAK_REALM_ADMIN_EMAIL
        value: ""
      - key: KEYCLOAK_REALM_ADMIN_PASSWORD
        sync: false
      - key: OLLAMA_BASE_URL
        fromService:
          type: pserv
          name: galerie-ollama
          property: hostport
      - key: OLLAMA_MODEL
        value: llama3.2:3b

  - type: web
    name: galerie-frontend
    runtime: static
    rootDir: galerie_de_ruiter_frontend_app
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: SITE_URL
        value: https://galeriederuiter.cloud-ip.cc
      - key: VITE_JAVA_API_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_JAVA_BACKEND_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_API_URL
        value: https://galerie-java-api.onrender.com
      - key: VITE_KEYCLOAK_URL
        value: https://galerie-keycloak.onrender.com
      - key: VITE_KEYCLOAK_REALM
        value: movie_project_keycloak
      - key: VITE_KEYCLOAK_CLIENT_ID
        value: movie_project_frontend_client
      # The Google Maps browser key: the location page's Embed API frame and the admin's address
      # lookup (see "Google Maps" in the frontend README). Restricted by HTTP referrer to the
      # gallery's origins; without it the location page shows the address and a Maps link instead.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # The security headers a static site cannot get from a server: there is nothing at the origin to
    # inject them, so Render sends these from the edge. Values are sent as written - there is no
    # environment substitution - so the API and Keycloak origins are spelled out; they are the same
    # ones the build above uses. `nginx.conf` sends the same policy for the container deployment,
    # and `src/securityHeaders.test.ts` fails when the two drift apart.
    #
    # Editing this file only reaches the site when the Blueprint is synced in the Render dashboard:
    # `autoDeploy` deploys code, not Blueprint changes.
    #
    # `style-src-attr 'unsafe-inline'` is not decoration: the charts size their bars, the theme
    # picker draws its swatches and the photo carousel positions its slides with style attributes,
    # which `style-src 'self'` alone would block. Cross-Origin-Embedder-Policy is `credentialless`
    # rather than `require-corp`: the map frame and the silent sign-in frame send no CORP header, so
    # requiring one would block both, and neither grants anything the page does not already have.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://galerie-java-api.onrender.com; connect-src 'self' https://galerie-java-api.onrender.com https://galerie-keycloak.onrender.com https://maps.googleapis.com; frame-src 'self' https://www.google.com https://galerie-keycloak.onrender.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Trusted Types is staged in report-only mode, exactly as the container deployment sends it
      # (see security-headers.conf): the built site reports webpack's own chunk loader setting
      # `script.src`, which every navigation needs. Give webpack a policy with `output.trustedTypes`
      # and then move the directive into the enforced policy above.
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "require-trusted-types-for 'script'; trusted-types default"
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Origin-Agent-Cluster
        value: "?1"
      - path: /*
        name: X-DNS-Prefetch-Control
        value: "off"
      - path: /*
        name: X-XSS-Protection
        value: "0"
      # The gallery type keeps its name and is never edited in place, and Render's default for a file
      # it does not fingerprint is max-age=0: without this every visit revalidates both preloaded
      # faces, which is two round trips before the text can settle.
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The manifest agents and registries look for by convention (public/.well-known/ai-catalog.json,
      # served at /ard.json's path too). The publishing guide asks for
      # `Access-Control-Allow-Origin: *`, because a crawler reading it from a page of its own makes a
      # cross-origin request; `same-origin` is what every other response keeps, so the exception is
      # scoped to the one directory that exists to be read from elsewhere.
      - path: /.well-known/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /.well-known/*
        name: Cross-Origin-Resource-Policy
        value: cross-origin
      # Signing out ends the Keycloak session, and Keycloak then returns the browser to /logout (see
      # the redirectUri in AuthContext.logout). That one response tells the browser to drop what it
      # holds for the gallery's origin - cookies, storage (the chosen language, the remembered city,
      # the cached responses, the chat session) and the HTTP cache - which is the part the app
      # cannot clear itself. This is why the header is on a path rather than on the whole site.
      - path: /logout
        name: Clear-Site-Data
        value: '"cache", "cookies", "storage"'
