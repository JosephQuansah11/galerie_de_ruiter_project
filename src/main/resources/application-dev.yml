spring:
  application:
    name: galerie_de_ruiter
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:galerie}
    username: ${POSTGRES_USER:galerie_app}
    password: ${POSTGRES_PASSWORD:dev-local-only}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  devtools:
    add-properties: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PUBLIC_KEYCLOAK_ISSUER_URI:http://localhost:${KEYCLOAK_HTTP_PORT:8082}/realms/movie_project_keycloak}
  
server:
  port: ${PORT:8080}

keycloak:
  server-url: ${PUBLIC_KEYCLOAK_URL:http://localhost:${KEYCLOAK_HTTP_PORT:8082}}
  realm: ${KEYCLOAK_REALM:movie_project_keycloak}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:dev-local-only}
