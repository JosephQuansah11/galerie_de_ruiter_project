spring:
  config:
    activate:
      on-profile: prod
    import: optional:file:.env.production[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}

server:
  address: 0.0.0.0
  port: ${PORT:8080}

keycloak:
  server-url: ${PUBLIC_KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  admin-realm: ${KEYCLOAK_ADMIN_REALM}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}
  provision-admin:
    required: true
    username: ${KEYCLOAK_REALM_ADMIN_USERNAME:}
    first-name: ${KEYCLOAK_REALM_ADMIN_FIRST_NAME:}
    last-name: ${KEYCLOAK_REALM_ADMIN_LAST_NAME:}
    email: ${KEYCLOAK_REALM_ADMIN_EMAIL:}
    password: ${KEYCLOAK_REALM_ADMIN_PASSWORD:admin}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2:3b}
  # Keep the model resident for the whole chat session instead of reloading per prompt.
  keep-alive: ${OLLAMA_KEEP_ALIVE:30m}
  # Download the configured model the first time the chat page asks for it, so a fresh
  # installation never needs a manual "ollama pull". That same model is then pinned for the
  # whole session and kept resident by the chat page heartbeat.
  auto-pull: ${OLLAMA_AUTO_PULL:true}
  pull-retry: ${OLLAMA_PULL_RETRY:60s}
  pull-timeout: ${OLLAMA_PULL_TIMEOUT:30m}
  touch-interval: ${OLLAMA_TOUCH_INTERVAL:10m}

app:
  security:
    # The Render frontend and API are served from different origins, so the CSRF
    # cookie must be readable and sendable across sites.
    cross-site-csrf-cookies: ${CROSS_SITE_CSRF_COOKIES:true}
  models:
    # A GLB upload keeps roughly three copies of the file in memory (multipart, byte array,
    # JDBC binding), so a small production instance must cap it below the development
    # limit. Raise it together with the instance memory and the proxy body limit, for
    # example MODELS_MAX_SIZE_MB=250 with a 2 GB instance.
    max-size-mb: ${MODELS_MAX_SIZE_MB:100}

FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}