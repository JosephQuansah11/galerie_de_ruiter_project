spring:
  config:
    activate:
      on-profile: prod
    import: optional:file:.env.production[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # A small pool is deliberate. Supabase limits connections per project, and the API is a
      # low-traffic gallery; a pool of 5 serves it without holding a free-plan connection hostage
      # for every idle JVM thread. Raise DB_POOL_MAX_SIZE if load says so.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_KEEPALIVE_MS:60000}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Import work and bulk deletion send many rows in one round trip instead of one statement
        # per row. The timezone keeps Instants stable regardless of the host's locale.
        jdbc:
          batch_size: ${JPA_BATCH_SIZE:20}
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
  h2:
    console:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:}/protocol/openid-connect/certs}

server:
  address: 0.0.0.0
  port: ${PORT:8080}

# Legacy settings for a Keycloak deployment. Production uses the supabase profile, where the
# Keycloak beans are inactive; the empty defaults keep the properties resolvable when those env
# vars are intentionally absent from Render.
keycloak:
  server-url: ${PUBLIC_KEYCLOAK_URL:}
  realm: ${KEYCLOAK_REALM:}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
  provision-admin:
    required: ${KEYCLOAK_REALM_ADMIN_REQUIRED:true}
    username: ${KEYCLOAK_REALM_ADMIN_USERNAME:}
    first-name: ${KEYCLOAK_REALM_ADMIN_FIRST_NAME:}
    last-name: ${KEYCLOAK_REALM_ADMIN_LAST_NAME:}
    email: ${KEYCLOAK_REALM_ADMIN_EMAIL:}
    password: ${KEYCLOAK_REALM_ADMIN_PASSWORD:}

app:
  security:
    # The Render frontend and API are served from different origins, so the CSRF
    # cookie must be readable and sendable across sites.
    cross-site-csrf-cookies: ${CROSS_SITE_CSRF_COOKIES:true}
  models:
    # A GLB upload keeps roughly three copies of the file in memory (multipart, byte array,
    # JDBC binding), so a small production instance must cap it below the development
    # limit. Raise it together with the instance memory and the proxy body limit, for
    # example MODELS_MAX_SIZE_MB=250 with a 2 GB instance.
    max-size-mb: ${MODELS_MAX_SIZE_MB:100}

FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}