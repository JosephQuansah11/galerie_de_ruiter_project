# Supabase Auth, ready to be switched on and inert until it is.
#
# Activating this profile - SPRING_PROFILES_ACTIVE=prod,supabase - is the moment the API accepts
# Supabase's tokens instead of Keycloak's. Until then nothing here is read, so the running gallery
# is unaffected by the file's presence.
#
# The issuer, signing algorithm and key set are named:
#
#   jwk-set-uri  Supabase publishes its signing keys at /auth/v1/.well-known/jwks.json, which is not
#                the path issuer-uri auto-discovers, so the key set has to be named explicitly.
#
#   issuer-uri   names the Supabase issuer so `iss` is validated. Because the JWK set URI is also
#                present, Spring uses the key set directly rather than building the decoder from
#                OpenID discovery.
#
#   jws-algorithms  Supabase signs with ES256; Spring Boot's default is RS256, so the algorithm is
#                   named explicitly. Without it every valid token fails with "Another algorithm
#                   expected, or no matching key(s) found".
#
# Roles arrive in app_metadata (see KeycloakJwtAuthenticationConverter): Supabase keeps user_metadata
# writable by its owner, so a role there would be a role anyone can grant themselves.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # The prod profile still names Keycloak. This replaces both its issuer and key set with
          # the Supabase project's. Naming the issuer validates `iss`; it does not switch Spring to
          # OpenID discovery, because a JWK set URI is also present.
          issuer-uri: ${SUPABASE_ISSUER_URI:https://bgmxpublcoldebamstbj.supabase.co/auth/v1}
          # Supabase signs with ES256. Spring Boot's default is RS256, so without this every token
          # fails with "Another algorithm expected, or no matching key(s) found".
          jws-algorithms:
            - ES256
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://bgmxpublcoldebamstbj.supabase.co/auth/v1/.well-known/jwks.json}

# The admin client is not needed for validating tokens; it is here because assigning the gallery's
# admin role is a server-side write to auth.users.raw_app_meta_data, and this is where the service
# would find the credentials for it. Unused by the resource server itself.
supabase:
  service-url: ${SUPABASE_URL:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
