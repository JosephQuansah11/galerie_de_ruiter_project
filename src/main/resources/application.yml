spring:
  # profiles:
  #   active:
  #   - dev

  config:
    import: optional:file:.env.production[.properties]
    
  application:
    name: galerie_de_ruiter


  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa: 
    show-sql: true
    hibernate:
      ddl-auto: update


  devtools:
    add-properties: false


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/movie_project_keycloak}
  
logging:
  level:
    org.springframework: DEBUG

server:
  port: ${PORT}

keycloak:
  server-url: ${PUBLIC_KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  admin-realm: ${KEYCLOAK_ADMIN_REALM}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/checkout/success}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/checkout/cancel}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}
