spring:
  profiles:
    active: dev

  application:
    name: galerie_de_ruiter


  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa: 
    show-sql: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      separator: "@@@@"


  devtools:
    add-properties: false

  servlet:
    multipart:
      # .glb models are far larger than photographs. Both limits and the validation in
      # AntiqueModelController follow MODELS_MAX_SIZE_MB, so development and production
      # reject the same oversized files instead of failing inside the multipart parser.
      max-file-size: ${MODELS_MAX_SIZE_MB:250}MB
      max-request-size: ${MODELS_REQUEST_MAX_SIZE_MB:310}MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/movie_project_keycloak}
          # issuer-uri: https://3kbd6fkk-8081.euw.devtunnels.ms/realms/movie_project_keycloak
  
logging:
  level:
    root: INFO

server:
  port: ${PORT}

keycloak:
  server-url: ${PUBLIC_KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  admin-realm: ${KEYCLOAK_ADMIN_REALM}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

app:
  models:
    # 3D models are stored as files, not database rows: a .glb is far larger than a
    # photograph, so keeping it in a bytea column pushed every upload and download through
    # the JVM heap and through PostgreSQL. In production this points at a persistent disk
    # (see render.yaml); locally it defaults to ./data/models inside the project.
    storage-dir: ${MODELS_STORAGE_DIR:./data/models}
