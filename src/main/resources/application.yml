spring:
  profiles:
    active: dev

  application:
    name: galerie_de_ruiter


  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa: 
    show-sql: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      separator: "@@@@"


  devtools:
    add-properties: false

  servlet:
    multipart:
      # .glb models are far larger than photographs. Both limits and the validation in
      # AntiqueModelController follow MODELS_MAX_SIZE_MB, so development and production
      # reject the same oversized files instead of failing inside the multipart parser.
      max-file-size: ${MODELS_MAX_SIZE_MB:250}MB
      max-request-size: ${MODELS_REQUEST_MAX_SIZE_MB:310}MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/movie_project_keycloak}
          # issuer-uri: https://3kbd6fkk-8081.euw.devtunnels.ms/realms/movie_project_keycloak
  
logging:
  level:
    root: INFO

server:
  port: ${PORT}

keycloak:
  server-url: ${PUBLIC_KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM}
  admin-realm: ${KEYCLOAK_ADMIN_REALM}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2:3b}
  # Keep the model resident for the whole chat session instead of reloading per prompt.
  keep-alive: ${OLLAMA_KEEP_ALIVE:30m}
  # Download the configured model the first time the chat page asks for it, so a fresh
  # installation never needs a manual "ollama pull". That same model is then pinned for the
  # whole session and kept resident by the chat page heartbeat.
  auto-pull: ${OLLAMA_AUTO_PULL:true}
  pull-retry: ${OLLAMA_PULL_RETRY:60s}
  pull-timeout: ${OLLAMA_PULL_TIMEOUT:30m}
  touch-interval: ${OLLAMA_TOUCH_INTERVAL:10m}
