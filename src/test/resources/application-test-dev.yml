spring:
  application:
    name: galerie_de_ruiter_db
  datasource:
    url: jdbc:h2:mem:galerie;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  devtools:
    add-properties: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/movie_project_keycloak

server:
  port: 0

keycloak:
  server-url: http://localhost:8081
  realm: movie_project_keycloak
  admin-realm: master
  admin-client-id: admin-cli
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:test-admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:}
